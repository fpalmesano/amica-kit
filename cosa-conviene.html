<!DOCTYPE html>
<!--
  ============================================================================
  AMICA - Kit consulente · Cosa ti conviene
  ----------------------------------------------------------------------------
  Strumento di PRIMA battuta: sette domande qualitative, nessun euro.
  Serve a rispondere subito alla domanda che il cliente fa per prima
  ("noleggio, leasing o finanziamento?") senza aprire una simulazione.

  METODO: modello a punteggio, non un calcolo. Ogni risposta assegna punti
  alle quattro formule; vince quella con il punteggio piu' alto. I pesi sono
  una taratura iniziale e vanno rivisti sulla base di cosa chiude davvero
  in salone. NON e' un algoritmo predittivo: e' la formalizzazione di un
  ragionamento commerciale, e va presentato al cliente come tale.

  Regole dure che scavalcano il punteggio:
  - PMI + veicolo commerciale genuino -> segnalare che solo leasing e
    finanziamento accedono alla Nuova Sabatini (il noleggio e' escluso).
  - Regime forfettario -> nessuna deduzione: la scelta e' solo finanziaria.
  - Privato -> il leasing e' raramente proposto.

  AMBITO: CLIENTE del design system AMICADesignSystem_be2d1b.
  ============================================================================
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMICA &middot; Cosa ti conviene</title>
<script src="parametri.js"></script>
<style>
@font-face{font-family:"Montserrat";src:url("assets/fonts/montserrat-variable-latin.woff2") format("woff2-variations");font-weight:400 900;font-style:normal;font-display:swap;}
:root{
  --amica-black:#000000; --amica-white:#FFFFFF; --amica-red:#EB0000; --amica-red-deep:#A90000;
  --gray-50:#F7F7F7; --gray-100:#EFEFEF; --gray-200:#E2E2E2; --gray-300:#C9C9C9;
  --gray-400:#A3A3A3; --gray-500:#7A7A7A; --gray-600:#555555; --gray-700:#3A3A3A; --gray-800:#222222;
  --gradient-brand:linear-gradient(135deg,var(--amica-red) 0%,var(--amica-red-deep) 100%);
  --font-sans:"Montserrat","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --size-xs:12px; --size-sm:14px; --size-md:16px; --size-lg:18px; --size-xl:22px;
  --size-2xl:28px; --size-3xl:36px; --size-4xl:48px; --size-5xl:64px;
  --tracking-label:0.08em; --tracking-wide:0.25em; --tracking-tight:-0.01em;
  --leading-tight:1.1; --leading-snug:1.25; --leading-normal:1.5;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px;
  --space-6:32px; --space-7:48px; --space-8:64px;
  --radius-sm:4px; --radius-md:8px; --radius-lg:12px; --radius-pill:999px;
  --shadow-card:0 2px 8px rgba(0,0,0,0.10); --shadow-card-hover:0 6px 20px rgba(0,0,0,0.16);
  --ease-standard:cubic-bezier(0.2,0,0,1); --duration-fast:120ms; --duration-base:200ms;
  --x-container-max:1200px; --x-focus-shadow:0 0 0 2px rgba(235,0,0,0.35);
}
*{box-sizing:border-box;} html,body{margin:0;padding:0;}
body{background:var(--amica-white);color:var(--amica-black);font-family:var(--font-sans);
  font-size:var(--size-md);line-height:var(--leading-normal);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;}
.wrap{max-width:900px;margin:0 auto;padding:0 var(--space-5) var(--space-8);}
@media(max-width:768px){.wrap{padding:0 var(--space-4) var(--space-7);}}
:focus-visible{outline:none;box-shadow:var(--x-focus-shadow);}

.masthead{background:var(--amica-black);color:var(--amica-white);}
.masthead .in{max-width:var(--x-container-max);margin:0 auto;padding:0 var(--space-5);display:flex;align-items:center;gap:var(--space-5);min-height:72px;}
@media(max-width:768px){.masthead .in{padding:0 var(--space-4);}}
.logo-amica{height:48px;width:auto;display:block;}
@media(max-width:768px){.logo-amica{height:36px;}}
.claim{font-size:var(--size-xs);font-weight:700;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--gray-400);}
@media(max-width:768px){.claim{display:none;}}
.masthead a.back{margin-left:auto;font-size:var(--size-xs);font-weight:700;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--amica-white);text-decoration:none;border-bottom:2px solid var(--amica-red);white-space:nowrap;}

/* barra di avanzamento */
.prog{display:flex;gap:var(--space-1);margin:var(--space-7) 0 var(--space-6);}
.prog i{flex:1;height:4px;background:var(--gray-200);border-radius:var(--radius-pill);}
.prog i.on{background:var(--amica-red);}
.step{font-size:var(--size-xs);font-weight:700;letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--gray-600);margin-bottom:var(--space-3);}

h1{font-size:var(--size-3xl);line-height:var(--leading-tight);font-weight:800;margin:0 0 var(--space-6);letter-spacing:var(--tracking-tight);}
@media(max-width:768px){h1{font-size:var(--size-xl);}}

.opts{display:grid;grid-template-columns:1fr;gap:var(--space-3);}
@media(min-width:700px){.opts.two{grid-template-columns:repeat(2,1fr);}}
.opt{
  background:var(--amica-white);border:1px solid var(--gray-200);border-left:4px solid var(--gray-200);
  border-radius:var(--radius-md);padding:var(--space-5);text-align:left;cursor:pointer;font:inherit;color:inherit;
  transition:border-left-color var(--duration-fast) var(--ease-standard),box-shadow var(--duration-base) var(--ease-standard),transform var(--duration-base) var(--ease-standard);
}
.opt:hover{border-left-color:var(--amica-red);box-shadow:var(--shadow-card-hover);transform:translateY(-2px);}
.opt .t{display:block;font-size:var(--size-lg);font-weight:800;line-height:var(--leading-snug);}
.opt .d{display:block;font-size:13px;color:var(--gray-600);margin-top:var(--space-2);}

.nav{display:flex;gap:var(--space-3);margin-top:var(--space-6);align-items:center;}
.btn{font:inherit;font-size:13px;font-weight:700;letter-spacing:var(--tracking-label);text-transform:uppercase;
  background:transparent;border:1px solid var(--gray-200);color:var(--amica-black);padding:12px 24px;border-radius:var(--radius-md);cursor:pointer;}
.btn:hover{border-color:var(--gray-400);}
.btn.p{background:var(--amica-red);border-color:var(--amica-red);color:var(--amica-white);}
.btn.p:hover{background:var(--amica-red-deep);border-color:var(--amica-red-deep);}
.btn:active{transform:scale(0.98);}

/* verdetto */
.verdict{background:var(--gradient-brand);color:var(--amica-white);border-radius:var(--radius-md);padding:var(--space-6);}
.verdict .kb{font-size:var(--size-xs);font-weight:700;letter-spacing:var(--tracking-wide);text-transform:uppercase;opacity:.85;margin-bottom:var(--space-2);}
.verdict .big{font-size:var(--size-3xl);font-weight:900;line-height:var(--leading-tight);letter-spacing:var(--tracking-tight);}
@media(max-width:768px){.verdict .big{font-size:var(--size-2xl);}}
.verdict .sub{font-size:var(--size-md);margin-top:var(--space-3);font-weight:500;opacity:.95;max-width:60ch;}

.why{background:var(--amica-white);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:var(--space-5);margin-top:var(--space-3);}
.why h3{font-size:var(--size-xs);font-weight:700;letter-spacing:var(--tracking-label);text-transform:uppercase;margin:0 0 var(--space-4);}
.why ul{margin:0;padding:0;list-style:none;}
.why li{display:flex;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:1px solid var(--gray-200);font-size:var(--size-sm);}
.why li:last-child{border-bottom:0;}
.why li b{color:var(--amica-red);font-weight:800;flex:none;}
.rank{display:grid;grid-template-columns:1fr;gap:var(--space-2);margin-top:var(--space-3);}
.rk{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);background:var(--gray-50);font-size:var(--size-sm);}
.rk .n{font-weight:900;color:var(--gray-400);width:20px;flex:none;}
.rk .l{font-weight:800;flex:1;}
.rk .bar{height:6px;background:var(--gray-200);border-radius:var(--radius-pill);width:110px;flex:none;overflow:hidden;}
.rk .bar i{display:block;height:100%;background:var(--gray-500);}
.rk.win{background:var(--amica-black);color:var(--amica-white);}
.rk.win .n{color:var(--amica-red);}
.rk.win .bar{background:var(--gray-800);} .rk.win .bar i{background:var(--amica-red);}

.alert{background:var(--amica-white);border-radius:var(--radius-md);box-shadow:var(--shadow-card);border-left:4px solid var(--amica-red);padding:var(--space-5);margin-top:var(--space-3);}
.alert h3{font-size:var(--size-xs);font-weight:700;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--amica-red);margin:0 0 var(--space-2);}
.alert p{margin:0 0 var(--space-2);font-size:var(--size-sm);line-height:var(--leading-normal);}
.alert p:last-child{margin-bottom:0;}

.next{display:grid;grid-template-columns:1fr;gap:var(--space-3);margin-top:var(--space-5);}
@media(min-width:700px){.next{grid-template-columns:repeat(2,1fr);}}
.nx{display:block;background:var(--amica-white);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:var(--space-5);text-decoration:none;color:inherit;
  transition:box-shadow var(--duration-base) var(--ease-standard),transform var(--duration-base) var(--ease-standard);}
.nx:hover{box-shadow:var(--shadow-card-hover);transform:translateY(-2px);}
.nx .n{font-size:var(--size-xs);font-weight:800;letter-spacing:var(--tracking-label);color:var(--amica-red);}
.nx .t{font-size:var(--size-lg);font-weight:800;margin-top:var(--space-2);line-height:var(--leading-snug);}
.nx .d{font-size:13px;color:var(--gray-600);margin-top:var(--space-2);}

.metodo{margin-top:var(--space-6);padding:var(--space-5);background:var(--gray-50);border-radius:var(--radius-md);}
.metodo h3{font-size:var(--size-xs);font-weight:700;letter-spacing:var(--tracking-label);text-transform:uppercase;margin:0 0 var(--space-3);}
.metodo p{margin:0 0 var(--space-2);font-size:13px;color:var(--gray-600);line-height:var(--leading-normal);}
.metodo p:last-child{margin-bottom:0;} .metodo b{color:var(--amica-black);}
.hidden{display:none;}
@media(max-width:768px){.opt{padding:var(--space-4);} .opt .t{font-size:var(--size-md);}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>

var risposte = {}, idx = 0;

function punteggi(){
  var P = {nol:0, lea:0, fin:0, acq:0}, motivi = [];
  Q.forEach(function(q){
    var v = risposte[q.k]; if(!v) return;
    var o = q.o.filter(function(x){ return x.v===v; })[0]; if(!o) return;
    Object.keys(P).forEach(function(f){ P[f] += (o.p[f]||0); });
    motivi.push({o:o, p:o.p});
  });
  return {P:P, motivi:motivi};
}

function disegnaProg(){
  var el = document.getElementById("prog"), h = "";
  for(var i=0;i<Q.length;i++) h += '<i class="'+(i<=idx?"on":"")+'"></i>';
  el.innerHTML = (idx>=Q.length) ? '<i class="on"></i>' : h;
}

function domanda(){
  var q = Q[idx];
  var h = '<div class="step">Domanda '+(idx+1)+' di '+Q.length+'</div>';
  h += '<h1>'+q.t+'</h1>';
  h += '<div class="opts'+(q.o.length>4?" two":"")+'">';
  q.o.forEach(function(o){
    h += '<button class="opt" data-v="'+o.v+'"><span class="t">'+o.t+'</span><span class="d">'+o.d+'</span></button>';
  });
  h += '</div>';
  if(idx>0) h += '<div class="nav"><button class="btn" id="indietro">Indietro</button></div>';
  document.getElementById("app").innerHTML = h;
  document.querySelectorAll(".opt").forEach(function(b){
    b.onclick = function(){ risposte[q.k] = b.dataset.v; idx++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  var ind = document.getElementById("indietro");
  if(ind) ind.onclick = function(){ idx--; render(); };
}

function verdetto(){
  var R = punteggi(), P = R.P;
  var ord = Object.keys(P).sort(function(a,b){ return P[b]-P[a]; });
  var win = ord[0], sec = ord[1];

  /* motivi: prendo quelli attribuiti alla formula vincente, ordinati per peso */
  var motivi = R.motivi
    .filter(function(m){ return m.o.why && m.o.why[win]; })
    .sort(function(a,b){ return (b.p[win]||0)-(a.p[win]||0); })
    .slice(0,3)
    .map(function(m){ return m.o.why[win]; });

  var min = Math.min.apply(null, ord.map(function(f){ return P[f]; }));
  var max = Math.max.apply(null, ord.map(function(f){ return P[f]; }));
  var span = (max-min) || 1;

  var h = '<div class="verdict"><div class="kb">La formula pi\u00f9 adatta a questo cliente</div>'
        + '<div class="big">'+FORM[win].lab+'</div>'
        + '<div class="sub">Seconda scelta: '+FORM[sec].lab.toLowerCase()+'. A condizioni economiche simili, la distanza fra le due dipende dagli elementi elencati sotto.</div></div>';

  h += '<div class="rank">';
  ord.forEach(function(f,i){
    var w = Math.round(((P[f]-min)/span)*100);
    h += '<div class="rk'+(i===0?" win":"")+'"><span class="n">'+(i+1)+'</span><span class="l">'+FORM[f].lab+'</span>'
       + '<span class="bar"><i style="width:'+Math.max(6,w)+'%"></i></span></div>';
  });
  h += '</div>';

  if(motivi.length){
    h += '<div class="why"><h3>Gli elementi che pesano di pi\u00f9</h3><ul>';
    motivi.forEach(function(m,i){ h += '<li><b>'+(i+1)+'</b><span>'+m+'</span></li>'; });
    h += '</ul></div>';
  }

  h += '<div class="alert"><h3>Il rovescio di questa formula</h3><p>'+CONTRO[win]+'</p></div>';

  /* regole dure che scavalcano il punteggio */
  var av = [];
  var impresa = ["impresa","ditta","agente","strum"].indexOf(risposte.chi)>=0;
  if(impresa && risposte.veicolo==="commerciale" && win==="nol"){
    av.push("<b>Attenzione.</b> Il cliente \u00e8 un'impresa e stiamo parlando di un veicolo commerciale: la <b>Nuova Sabatini</b> \u00e8 accessibile solo con finanziamento bancario o leasing finanziario, mai col noleggio. Il contributo pu\u00f2 valere diverse migliaia di euro e non entra in questo punteggio.");
  }
  if(risposte.chi==="forfe"){
    av.push("<b>In regime forfettario non esiste alcun vantaggio fiscale.</b> Il cliente non deduce e non detrae: fra le quattro formule la differenza \u00e8 solo di cassa, di servizio e di flessibilit\u00e0.");
  }
  if(risposte.chi==="privato" && win==="lea"){
    av.push("<b>Poche finanziarie propongono leasing a soggetti privati.</b> Dove disponibile, le condizioni sono di norma meno competitive di un finanziamento classico.");
  }
  if(risposte.tenere==="no" && risposte.km==="alti"){
    av.push("<b>Combinazione delicata.</b> Non vuole tenersi il mezzo ma fa molta strada: sul noleggio la taratura del pacchetto chilometrico diventa la variabile decisiva, perch\u00e9 le penali per eccedenza erodono rapidamente il vantaggio.");
  }
  if(av.length){
    h += '<div class="alert"><h3>Elementi specifici di questo profilo</h3>'
       + av.map(function(a){ return "<p>"+a+"</p>"; }).join("") + '</div>';
  }

  h += '<div class="next">'
     + '<a class="nx" href="simulatore-fiscale.html"><span class="n">Passo 2</span>'
       + '<span class="t">Adesso i numeri</span>'
       + '<span class="d">Inquadramento fiscale, confronto delle quattro formule al netto del recupero, Nuova Sabatini e fringe benefit.</span></a>'
     + '<a class="nx" href="costi-esercizio.html"><span class="n">Passo 3</span>'
       + '<span class="t">Quanto costa muoverla</span>'
       + '<span class="d">Costo di alimentazione per motorizzazione, sui chilometri e sul percorso reali del cliente.</span></a>'
     + '</div>';

  h += '<div class="nav"><button class="btn p" id="ricomincia">Ricomincia</button>'
     + '<button class="btn" id="indietro">Torna all\'ultima domanda</button></div>';

  h += '<div class="metodo"><h3>Come funziona questo strumento</h3>'
     + '<p>Non \u00e8 un calcolo: \u00e8 un <b>modello a punteggio</b> che mette in ordine le quattro formule in base alle risposte. Serve a dare subito una direzione, non a stabilire un prezzo.</p>'
     + '<p>La conferma arriva dai numeri del passo 2. Se il punteggio e i numeri dicono cose diverse, <b>vince il numero</b>: significa che il modello ha pesato male qualcosa.</p>'
     + '<p>I pesi sono una taratura iniziale, calibrata sul comportamento generale del mercato e non sullo storico AMICA.</p></div>';

  document.getElementById("app").innerHTML = h;
  document.getElementById("ricomincia").onclick = function(){ risposte = {}; idx = 0; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  document.getElementById("indietro").onclick = function(){ idx = Q.length-1; render(); window.scrollTo({top:0,behavior:"smooth"}); };
}

function render(){
  disegnaProg();
  if(idx >= Q.length) verdetto(); else domanda();
}
render();
piedeVersione();
</script>
</body>
</html>
